<style>
/* Container: Define o tamanho da "fatia" na tela */
.fatia-container {
  height: 40vh;      /* Define a altura da "fatia" (ex: 30% da altura da tela) */
  position: relative;
  overflow: hidden;   /* CORTA tudo o que estiver fora dessa altura */
  background-color: #000; /* Fundo preto preventivo */
}

/* A Imagem: Precisa ser posicionada para a fatia */
.fatia-img-crop {
  width: 100%;       /* Garante que a imagem preencha a largura da fatia */
  height: auto;      /* Mantém a proporção original da foto (não distorce) */
  
  position: absolute;
  top: 50%;          /* Move o topo da imagem para o centro do container */
  left: 50%;         /* Move a esquerda da imagem para o centro do container */
  
  /* O PULO DO GATO: Centraliza a imagem e define qual 'fatia' aparece */
  /* translateY(-50%) centraliza verticalmente a foto na fatia de 30vh */
  transform: translate(-50%, -50%); 
  
  min-height: 100%;  /* Garante que a imagem nunca seja menor que a fatia */
  object-fit: cover; /* Ajuste final preventivo para garantir o preenchimento */
  z-index: 1;
}

/* Opcional: Estilo para o conteúdo sobre a fatia */
.fatia-content {
  position: absolute;
  inset: 0;
  z-index: 2;
  background: rgba(0, 0, 0, 0.5); /* Escurecimento para leitura */
}
</style>

    <form id="formRecrutamento" class="row g-4 justify-content-center">
      <!-- Coluna Esquerda -->
      <div class="col-md-6">
        <div class="mb-3">
          <input type="text" name="nome" class="form-control recruit-input" placeholder="Nome completo" required>
        </div>
        <div class="mb-3">
          <input type="text" name="funcao" class="form-control recruit-input" placeholder="Função">
        </div>
        <div class="mb-4 d-flex align-items-center flex-wrap">
          <span class="me-3 fw-bold small text-uppercase">Disponibilidade imediata:</span>
          <div class="form-check form-check-inline">
            <input class="form-check-input recruit-check" type="radio" name="disponibilidade" value="sim" id="recruitSim">
            <label class="form-check-label" for="recruitSim">Sim</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input recruit-check" type="radio" name="disponibilidade" value="nao" id="recruitNao">
            <label class="form-check-label" for="recruitNao">Não</label>
          </div>
        </div>
        <div class="mb-3">
          <input type="email" name="email" class="form-control recruit-input" placeholder="Email" required>
        </div>
        <div class="d-flex align-items-center flex-wrap">
          <span class="me-3 fw-bold small text-uppercase">Interesse na vaga:</span>
          <div class="form-check form-check-inline">
            <input class="form-check-input recruit-check" type="checkbox" name="tipo_vaga" value="fixo" id="recruitFixo">
            <label class="form-check-label" for="recruitFixo">Fixo</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input recruit-check" type="checkbox" name="tipo_vaga" value="freela" id="recruitFreela">
            <label class="form-check-label" for="recruitFreela">Freela</label>
          </div>
        </div>
      </div>

      <!-- Coluna Direita -->
      <div class="col-md-5">
        <div class="mb-3">
          <input type="text" name="nascimento" class="form-control recruit-input" placeholder="Data de Nascimento">
        </div>
        <div class="mb-3">
          <label class="small d-block mb-1 text-uppercase fw-bold" style="font-size: 10px;">Envie seu currículo (PDF até 25MB)</label>
          <input type="file" name="curriculo" class="form-control recruit-input" accept=".pdf">
        </div>
        <div class="mb-3">
          <input type="text" name="cidade" class="form-control recruit-input" placeholder="Cidade">
        </div>
        <div class="mb-3">
          <input type="url" name="portfolio" class="form-control recruit-input" placeholder="Link do portfólio">
        </div>
      </div>

      <!-- Botão Enviar -->
      <div class="col-12 text-center mt-5">
        <button type="submit" id="btnRecruitSubmit" class="recruit-btn-submit">ENVIAR</button>
      </div>
    </form>

</section>

<style>
    /* Inputs Customizados */
.recruit-input {
    background-color: transparent !important;
    border: 1px solid #ffffff !important;
    border-radius: 0 !important;
    color: #ffffff !important;
    padding: 12px 15px !important;
    font-style: italic;
    font-size: 14px;
}

.recruit-input::placeholder {
    color: #666 !important;
    font-style: italic;
}

.recruit-input:focus {
    border-color: #F55C01 !important; /* Cor da Pô Creativity */
    box-shadow: none !important;
}

/* Radios e Checkboxes */
.recruit-check {
    background-color: transparent !important;
    border: 1px solid #fff !important;
    border-radius: 0 !important;
    cursor: pointer;
}

.recruit-check:checked {
    background-color: #F55C01 !important;
    border-color: #F55C01 !important;
}

/* Botão de Envio Estilo Título */
.recruit-btn-submit {
    background: none;
    border: none;
    color: #fff;
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: 2px;
    transition: all 0.3s ease;
    cursor: pointer;
}

.recruit-btn-submit:hover {
    color: #F55C01;
    transform: scale(1.05);
}

.recruit-btn-submit:disabled {
    color: #444;
    cursor: not-allowed;
}
</style>
